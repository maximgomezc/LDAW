<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Document</title>
</head>
<body>
    <form id="form-publicacion">
        <input id="titulo" placeholder="Título" required>
        <small id="errorTitulo"></small>
        <textarea id="descripcion" placeholder="Descripción"></textarea>
        <input id="autor" placeholder="Nombre del autor" required>
        <small id="errorAutor"></small>
        <input id="email" type="email" placeholder="Email" required>
        <small id="ayuda-email"></small>
        <select id="tipo">
            <option value="venta">Venta</option>
            <option value="servicio">Servicio</option>
        </select>
        <div id="campos-especificos"></div>
        <button>Publicar</button>
    </form>
    <div id="estado"></div>
    <button id="botonActualizar">Actualizar</button>
    <button id="botonForzarError">Forzar error</button>
    
    <output id="vista-previa"></output>
    <section id="lista-publicaciones"></section>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
